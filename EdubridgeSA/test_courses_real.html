<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Catalog API Test</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<h1 class="h5">Real API: Courses Dropdown Test</h1>
<p class="text-muted">Loads from <code>api/catalog.php</code> without fetch stubs.</p>
<div class="row g-3" style="max-width:800px">
  <div class="col-md-4">
    <label class="form-label">Course Category</label>
    <select id="course_category" class="form-select">
      <option value="">All Categories</option>
      <option>Education</option>
      <option>Business</option>
      <option>IT &amp; Computing</option>
    </select>
  </div>
  <div class="col-md-8">
    <label class="form-label">Course / Programme</label>
    <select id="program_choice" class="form-select">
      <option value="">Select Course</option>
    </select>
  </div>
  <div class="col-md-12">
    <div id="count" class="small text-muted"></div>
  </div>
</div>
<script>
(function(){
  const catSel = document.getElementById('course_category');
  const progSel = document.getElementById('program_choice');
  const countEl = document.getElementById('count');

  async function loadCourses(){
    const category = (catSel.value || '').trim();
    const url = new URL('api/catalog.php', window.location.origin);
    url.searchParams.set('type','courses');
    if(category) url.searchParams.set('category', category);
    const res = await fetch(url.toString());
    const data = await res.json();
    const items = (data.items || data) || [];
    progSel.innerHTML = '<option value="">Select Course</option>';
    items.forEach(function(c){
      const name = String((c && (c.course || c.name)) || '').trim();
      if(!name) return;
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      progSel.appendChild(opt);
    });
    countEl.textContent = 'Courses loaded: ' + items.length + (category ? (' (Category: '+category+')') : '');
  }

  catSel.addEventListener('change', loadCourses);
  loadCourses();
})();
</script>
</body>
</html>
