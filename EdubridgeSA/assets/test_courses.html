<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard Dropdowns Test</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<h1 class="h4">Linked Dropdowns Smoke Test</h1>
<div class="row g-3" style="max-width:800px">
  <div class="col-md-3">
    <label class="form-label">Institution Type</label>
    <select id="institution_type" class="form-select">
      <option value="">All</option>
      <option value="public">Public</option>
      <option value="private">Private</option>
    </select>
  </div>
  <div class="col-md-5">
    <label class="form-label">University</label>
    <select id="institution_choice_1" name="institution_choice_1" class="form-select">
      <option value="">Select University</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Course Category</label>
    <select id="course_category" class="form-select">
      <option value="">All Categories</option>
      <option>Education</option>
      <option>Business</option>
      <option>IT & Computing</option>
    </select>
  </div>
  <div class="col-md-8">
    <label class="form-label">Course / Programme</label>
    <select id="program_choice_1" name="program_choice_1" class="form-select">
      <option value="">Select Course</option>
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label">Province (for school)</label>
    <select id="school_province" class="form-select">
      <option value="">All Provinces</option>
      <option>Western Cape</option>
      <option>Gauteng</option>
    </select>
  </div>
  <div class="col-md-8">
    <label class="form-label">High School</label>
    <select id="high_school_name" name="high_school_name" class="form-select">
      <option value="">Select High School</option>
    </select>
  </div>
</div>
<script>
// Minimal fetch stub to simulate API responses for the test
(function(){
  const originalFetch = window.fetch;
  window.fetch = function(url){
    if(typeof url === 'string' && url.indexOf('api/catalog.php') !== -1){
      const u = new URL(url, window.location.origin);
      const type = u.searchParams.get('type');
      const category = u.searchParams.get('category') || '';
      if(type === 'courses'){
        const all = [
          {category:'Education', course:'BEd Foundation Phase'},
          {category:'Education', course:'PGCE Senior Phase & FET'},
          {category:'Business', course:'BCom Accounting'},
          {category:'IT & Computing', course:'BSc Computer Science'}
        ];
        const items = category ? all.filter(c => c.category.toLowerCase() === category.toLowerCase()) : all;
        return Promise.resolve(new Response(JSON.stringify({items}), {status:200}));
      }
      if(type === 'universities'){
        const items = [
          {name:'University of Cape Town', type:'public'},
          {name:'University of Johannesburg', type:'public'},
          {name:'Vega School', type:'private'}
        ];
        return Promise.resolve(new Response(JSON.stringify({items}), {status:200}));
      }
      if(type === 'schools'){
        const items = [
          {province:'Western Cape', name:'Pinelands High School'},
          {province:'Gauteng', name:'Parktown High School for Girls'}
        ];
        return Promise.resolve(new Response(JSON.stringify({items}), {status:200}));
      }
    }
    return originalFetch.apply(this, arguments);
  };
})();
</script>
<script>window.INIT_UNI=''; window.INIT_COURSE=''; window.INIT_SCHOOL='';</script>
<script src="wizard_linked_dropdowns.js"></script>
</body>
</html>
